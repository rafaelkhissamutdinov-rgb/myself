<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Цитата дня</title>
  <meta name="description" content="Предсказание на сегодня и цитата Булгакова, Чехова или Достоевского — каждый день новая, с новыми обоями.">
  <meta name="theme-color" content="#ffe8da">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4c2 16 8 24 28 28-20 4-26 12-28 28-2-16-8-24-28-28C24 28 30 20 32 4z' fill='%23e9825f'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/cormorant-garamond-cyrillic-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/marck-script-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wallpaper" aria-hidden="true">
    <div class="wp-layer" id="wp-a"></div>
    <div class="wp-layer" id="wp-b"></div>
  </div>
  <div class="night-veil" aria-hidden="true"></div>

  <main class="stage">
    <header class="now">
      <time class="clock" id="clock">--:--</time>
      <p class="date" id="date"></p>
      <h1 class="greeting" id="greeting"></h1>
    </header>

    <section class="card" aria-live="polite">
      <p class="label" id="label">Предсказание на сегодня</p>
      <p class="prediction" id="prediction"></p>
      <div class="divider" aria-hidden="true"><span></span><svg viewBox="0 0 64 64"><path d="M32 4c2 16 8 24 28 28-20 4-26 12-28 28-2-16-8-24-28-28C24 28 30 20 32 4z"/></svg><span></span></div>
      <figure class="quote">
        <blockquote id="quote"></blockquote>
        <figcaption>
          <span class="author" id="author"></span>
          <span class="work" id="work"></span>
        </figcaption>
      </figure>
    </section>

    <div class="actions">
      <button class="another" id="another" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h11l-3-3M20 17H9l3 3M18 7a6 6 0 0 1 2 5M6 17a6 6 0 0 1-2-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Другая цитата
      </button>
      <button class="back" id="back" type="button" hidden>вернуть цитату дня</button>
    </div>

    <footer class="foot">
      <p class="theme-name" id="theme-name"></p>
      <p class="note">Цитаты сверены с текстами произведений · предсказания написаны для этого сайта</p>
    </footer>
  </main>

  <script src="themes.js"></script>
  <script src="data/quotes.js"></script>
  <script src="data/predictions.js"></script>
  <script src="app.js"></script>
</body>
</html>
